# ~/docker/native/docker-compose.yml
# version: "3.9"

services:
  native-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lsp-native
    volumes:
      - .:/var/www/html
    networks:
      - global-network
    expose:
      - "9000"   # biar nginx bisa akses PHP-FPM

  web:
    image: nginx:stable
    container_name: native-nginx
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    environment:
      VIRTUAL_HOST: lsp-v3.local
    depends_on:
      - native-app   
    networks:
      - global-network

networks:
  global-network:
    external: true
